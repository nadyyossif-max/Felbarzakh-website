<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملف البرزخ</title>
<link rel="icon" href="/images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#050505; --panel:#0e0e0e; --gold:#c9a876; --gold-bright:#e0c496; --gold-dim:#8a734f;
    --wine:#6e2635; --mist:#a3a0987d; --mist2:#b8b3a8; --text:#ece7dc;
    --bg:#050505; --bg-soft:#0d0d0d; --surface:#11100f; --surface-2:#151311;
    --border:rgba(201,168,118,.18); --border-strong:rgba(201,168,118,.4);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:'Cairo',sans-serif; background:var(--bg); color:var(--text); position:relative;}
  h1,h2,h3{font-family:'Amiri',serif; font-weight:700;}
  body::before{
    content:""; position:fixed; inset:0; z-index:1; pointer-events:none;
    opacity:.045; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  nav{position:fixed; top:0; right:0; left:0; z-index:100; display:flex; justify-content:space-between; align-items:center; padding:16px 6vw; background:rgba(5,5,5,.92); border-bottom:1px solid var(--border);}
  nav .brand{display:flex; align-items:center; gap:10px;}
  nav .brand img{height:34px; width:auto; display:block;}
  nav a.back{color:var(--gold-bright); text-decoration:none; font-size:.85rem;}
  nav a.back:hover{color:var(--gold);}

  .dossier-hero{position:relative; min-height:78vh; display:flex; align-items:flex-end; overflow:hidden;}
  .dossier-hero-bg{position:absolute; inset:0; background-size:cover; background-position:center; filter:saturate(.85) contrast(1.08);}
  .dossier-hero-bg::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(5,5,5,.2) 0%, rgba(5,5,5,.5) 55%, rgba(5,5,5,.98) 100%);}
  .dossier-hero-inner{position:relative; z-index:2; padding:0 8vw 60px; max-width:900px;}
  .dossier-number{font-family:'Amiri',serif; font-size:1rem; color:var(--gold); letter-spacing:2px; margin-bottom:14px; display:block;}
  .dossier-cat{font-size:.72rem; color:var(--gold-dim); letter-spacing:2px; margin-bottom:16px; display:block;}
  .dossier-hero-inner h1{font-size:clamp(2.2rem, 5.5vw, 3.6rem); line-height:1.4;}

  .dossier-nav{position:sticky; top:0; z-index:90; background:rgba(5,5,5,.95); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); display:flex; gap:6px; overflow-x:auto; padding:0 8vw; scrollbar-width:none;}
  .dossier-nav::-webkit-scrollbar{display:none;}
  .dossier-nav a{white-space:nowrap; padding:16px 14px; color:var(--mist2); text-decoration:none; font-size:.84rem; border-bottom:2px solid transparent; transition:color .25s, border-color .25s;}
  .dossier-nav a:hover, .dossier-nav a.active{color:var(--gold-bright); border-color:var(--gold);}

  main{max-width:820px; margin:0 auto; padding:70px 8vw 100px; position:relative; z-index:2;}
  section.dossier-section{margin-bottom:80px; scroll-margin-top:70px;}
  .section-label{display:flex; align-items:center; gap:14px; margin-bottom:28px;}
  .section-label::after{content:""; height:1px; flex:1; background:var(--gold-dim); opacity:.35;}
  .section-label span{font-size:.72rem; letter-spacing:2.5px; color:var(--gold-dim);}
  .intro-text{font-size:1.12rem; line-height:2.1; color:var(--text); font-family:'Amiri',serif;}
  .reading-text{line-height:2.1; font-size:1.02rem; color:var(--text); white-space:pre-line;}

  .reading-preview-wrap{position:relative;}
  .reading-preview-wrap.is-clamped .reading-text{
    display:-webkit-box; -webkit-line-clamp:10; -webkit-box-orient:vertical; overflow:hidden;
  }
  .reading-preview-wrap.is-clamped::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:92px;
    background:linear-gradient(180deg, transparent, var(--bg) 82%); pointer-events:none;
  }
  .enter-waraqa-btn{
    display:inline-flex; align-items:center; gap:8px; margin-top:22px; padding:12px 24px;
    border-radius:2px; border:1px solid var(--gold-dim); background:transparent; color:var(--gold-bright);
    font-family:'Cairo',sans-serif; font-size:.88rem; cursor:pointer; transition:border-color .25s, color .25s, background .25s;
  }
  .enter-waraqa-btn:hover{border-color:var(--gold); background:rgba(201,168,118,.08); color:var(--gold);}

  .waraqa-overlay{
    position:fixed; inset:0; z-index:1000; background:rgba(4,4,4,.98); backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px); overflow-y:auto; display:none;
  }
  .waraqa-overlay.open{display:block;}
  .waraqa-topbar{
    position:sticky; top:0; z-index:2; display:flex; justify-content:flex-end; padding:20px 6vw;
    background:linear-gradient(180deg, rgba(4,4,4,.98) 60%, transparent);
  }
  .waraqa-close{
    background:transparent; border:1px solid var(--border-strong); color:var(--mist2); font-family:'Cairo',sans-serif;
    font-size:.82rem; padding:9px 18px; border-radius:2px; cursor:pointer; transition:color .25s, border-color .25s;
  }
  .waraqa-close:hover{color:var(--gold-bright); border-color:var(--gold);}
  .waraqa-inner{max-width:700px; margin:0 auto; padding:10px 8vw 130px;}
  .waraqa-cat{font-size:.72rem; color:var(--gold-dim); letter-spacing:2px; display:block; margin-bottom:14px;}
  .waraqa-inner h2{font-size:clamp(1.6rem, 3.6vw, 2.2rem); line-height:1.5; margin-bottom:38px;}
  .waraqa-text{font-family:'Amiri',serif; font-size:1.18rem; line-height:2.35; color:var(--text); white-space:pre-line;}

  .timeline{position:relative; padding-right:26px; border-right:1px solid var(--border-strong);}
  .timeline-item{position:relative; margin-bottom:32px; padding-right:26px;}
  .timeline-item::before{content:""; position:absolute; right:-31px; top:4px; width:9px; height:9px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 3px var(--bg), 0 0 0 4px var(--border-strong);}
  .timeline-item .t-year{font-family:'Amiri',serif; color:var(--gold-bright); font-size:1.05rem; margin-bottom:4px; display:block;}
  .timeline-item .t-label{font-weight:600; margin-bottom:6px; display:block;}
  .timeline-item .t-note{color:var(--mist2); font-size:.92rem; line-height:1.8;}

  .archive-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px;}
  .archive-item img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block; border:1px solid var(--border); filter:grayscale(.2);}
  .archive-item .caption{color:var(--mist2); font-size:.82rem; margin-top:8px; line-height:1.6;}

  .related-list{display:flex; flex-wrap:wrap; gap:12px;}
  .related-chip{display:flex; flex-direction:column; gap:2px; border:1px solid var(--border); padding:10px 18px; border-radius:2px; background:var(--surface);}
  .related-chip .r-type{font-size:.68rem; color:var(--gold); letter-spacing:1px;}
  .related-chip .r-name{font-size:.9rem; color:var(--text);}

  .episode-box{border:1px solid var(--border-strong); background:var(--surface); padding:26px 28px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;}
  .episode-box p{color:var(--mist2); font-size:.92rem;}
  .btn{display:inline-flex; align-items:center; gap:8px; padding:13px 26px; border-radius:2px; text-decoration:none; font-size:.88rem; background:var(--gold); color:#111; font-weight:700; transition:opacity .3s;}
  .btn:hover{opacity:.9;}

  .sources-list{list-style:none; display:flex; flex-direction:column; gap:10px;}
  .sources-list li{color:var(--mist2); font-size:.88rem; line-height:1.8; padding-right:18px; position:relative;}
  .sources-list li::before{content:"—"; position:absolute; right:0; color:var(--gold-dim);}

  footer{text-align:center; padding:36px 6vw; color:var(--mist2); font-size:.78rem; border-top:1px solid var(--border); position:relative; z-index:2;}
  footer img{height:20px; vertical-align:middle; margin-left:8px; opacity:.8;}

  @media (max-width:760px){
    nav{padding:16px 5vw;}
    main{padding:50px 7vw 80px;}
    .dossier-nav{padding:0 5vw;}
  }
</style>
</head>
<body>

<nav>
  <div class="brand"><img src="/images/logo.jpg" alt="في البرزخ"></div>
  <a href="/files.html" class="back">→ ملفات البرزخ</a>
</nav>

<div id="dossier-root">
  <p style="padding:150px 8vw; text-align:center; color:var(--mist2);">جاري تحميل الملف...</p>
</div>

<div class="waraqa-overlay" id="waraqa-overlay">
  <div class="waraqa-topbar">
    <button class="waraqa-close" id="waraqa-close">✕ إغلاق</button>
  </div>
  <div class="waraqa-inner">
    <div class="threshold"><span>الوراقة</span></div>
    <span class="waraqa-cat" id="waraqa-cat"></span>
    <h2 id="waraqa-heading"></h2>
    <div class="waraqa-text" id="waraqa-body"></div>
  </div>
</div>

<footer>
  <img src="/images/logo.jpg" alt="">
  © <span id="year"></span> في البرزخ — جميع الأفكار محفوظة لصاحبها
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

const WARAQA_THRESHOLD = 900; // chars — beyond this, القراءة تتعرض كمعاينة فقط

function openWaraqa(f){
  document.getElementById('waraqa-cat').textContent = f.category || '';
  document.getElementById('waraqa-heading').textContent = f.title || '';
  document.getElementById('waraqa-body').textContent = f.reading || '';
  const overlay = document.getElementById('waraqa-overlay');
  overlay.classList.add('open');
  overlay.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

function closeWaraqa(){
  document.getElementById('waraqa-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('waraqa-close').addEventListener('click', closeWaraqa);
document.getElementById('waraqa-overlay').addEventListener('click', (e) => {
  if(e.target.id === 'waraqa-overlay') closeWaraqa();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeWaraqa();
});

function timelineHTML(items){
  if(!items || !items.length) return '';
  return `<section class="dossier-section" id="sec-timeline">
    <div class="section-label"><span>خط زمني</span></div>
    <div class="timeline">
      ${items.map(t => `<div class="timeline-item">
        <span class="t-year">${escapeHTML(t.year)}</span>
        <span class="t-label">${escapeHTML(t.label)}</span>
        <span class="t-note">${escapeHTML(t.note || '')}</span>
      </div>`).join('')}
    </div>
  </section>`;
}

function archiveHTML(items){
  if(!items || !items.length) return '';
  return `<section class="dossier-section" id="sec-archive">
    <div class="section-label"><span>الأرشيف</span></div>
    <div class="archive-grid">
      ${items.map(a => `<div class="archive-item">
        <img src="${escapeHTML(a.image)}" alt="" loading="lazy">
        <div class="caption">${escapeHTML(a.caption || '')}</div>
      </div>`).join('')}
    </div>
  </section>`;
}

function relatedHTML(items){
  if(!items || !items.length) return '';
  return `<section class="dossier-section" id="sec-related">
    <div class="section-label"><span>مرتبط بالملف</span></div>
    <div class="related-list">
      ${items.map(r => `<div class="related-chip"><span class="r-type">${escapeHTML(r.type)}</span><span class="r-name">${escapeHTML(r.name)}</span></div>`).join('')}
    </div>
  </section>`;
}

function episodeHTML(url){
  if(!url) return '';
  return `<section class="dossier-section" id="sec-episode">
    <div class="section-label"><span>الحلقة المرتبطة</span></div>
    <div class="episode-box">
      <p>شاهد الحلقة الكاملة المرتبطة بهذا الملف على القناة.</p>
      <a class="btn" href="${escapeHTML(url)}" target="_blank" rel="noopener">شاهد الحلقة ↗</a>
    </div>
  </section>`;
}

function sourcesHTML(items){
  if(!items || !items.length) return '';
  return `<section class="dossier-section" id="sec-sources">
    <div class="section-label"><span>مصادر ومراجع</span></div>
    <ul class="sources-list">${items.map(s => `<li>${escapeHTML(s)}</li>`).join('')}</ul>
  </section>`;
}

function buildInternalNav(f){
  const links = [{ id: 'sec-intro', label: 'مقدمة' }];
  if (f.reading) links.push({ id: 'sec-reading', label: 'القراءة' });
  if (f.timeline && f.timeline.length) links.push({ id: 'sec-timeline', label: 'الخط الزمني' });
  if (f.archive && f.archive.length) links.push({ id: 'sec-archive', label: 'الأرشيف' });
  if (f.related && f.related.length) links.push({ id: 'sec-related', label: 'مرتبط' });
  if (f.episode_url) links.push({ id: 'sec-episode', label: 'الحلقة' });
  if (f.sources && f.sources.length) links.push({ id: 'sec-sources', label: 'المصادر' });
  return `<div class="dossier-nav">${links.map(l => `<a href="#${l.id}">${l.label}</a>`).join('')}</div>`;
}

function render(f){
  document.title = `${f.title} | ملفات البرزخ`;
  const root = document.getElementById('dossier-root');
  root.innerHTML = `
    <header class="dossier-hero">
      <div class="dossier-hero-bg" style="background-image:url('${escapeHTML(f.cover_image)}');"></div>
      <div class="dossier-hero-inner">
        <span class="dossier-number">ملف ${escapeHTML(f.number)}</span>
        <span class="dossier-cat">${escapeHTML(f.category)}</span>
        <h1>${escapeHTML(f.title)}</h1>
      </div>
    </header>
    ${buildInternalNav(f)}
    <main>
      <section class="dossier-section" id="sec-intro">
        <div class="section-label"><span>مقدمة</span></div>
        <p class="intro-text">${escapeHTML(f.intro)}</p>
      </section>
      ${f.reading ? `<section class="dossier-section" id="sec-reading">
        <div class="section-label"><span>القراءة</span></div>
        <div class="reading-preview-wrap${f.reading.length > WARAQA_THRESHOLD ? ' is-clamped' : ''}">
          <div class="reading-text">${escapeHTML(f.reading)}</div>
        </div>
        ${f.reading.length > WARAQA_THRESHOLD ? `<button class="enter-waraqa-btn" id="enter-waraqa-btn">ادخل الوراقة، واقرأ القراءة كاملة ↗</button>` : ''}
      </section>` : ''}
      ${timelineHTML(f.timeline)}
      ${archiveHTML(f.archive)}
      ${relatedHTML(f.related)}
      ${episodeHTML(f.episode_url)}
      ${sourcesHTML(f.sources)}
    </main>
  `;

  const enterBtn = document.getElementById('enter-waraqa-btn');
  if(enterBtn) enterBtn.addEventListener('click', () => openWaraqa(f));

  const navLinks = root.querySelectorAll('.dossier-nav a');
  const sections = Array.from(root.querySelectorAll('main section'));
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + entry.target.id));
      }
    });
  }, { rootMargin: '-40% 0px -50% 0px' });
  sections.forEach(s => io.observe(s));
}

const slug = new URLSearchParams(window.location.search).get('slug');
fetch('/content/files.json').then(r => r.json()).then(data => {
  const file = (data.files || []).find(f => f.slug === slug);
  if(!file){
    document.getElementById('dossier-root').innerHTML = `<p style="padding:150px 8vw; text-align:center; color:var(--mist2);">الملف غير موجود. <a href="/files.html" style="color:var(--gold-bright);">ارجع لملفات البرزخ ↗</a></p>`;
    return;
  }
  render(file);
}).catch(() => {
  document.getElementById('dossier-root').innerHTML = `<p style="padding:150px 8vw; text-align:center; color:var(--mist2);">تعذر تحميل الملف.</p>`;
});
</script>

</body>
</html>
