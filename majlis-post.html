<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منشور | مجلس البرزخ</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#050505; --panel:#0e0e0e; --gold:#c9a876; --gold-bright:#e0c496; --gold-dim:#8a734f;
    --wine:#6e2635; --mist:#a3a0987d; --mist2:#b8b3a8; --text:#ece7dc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:'Cairo',sans-serif; background:radial-gradient(ellipse 1100px 640px at 50% -10%, var(--panel) 0%, var(--black) 68%) var(--black); color:var(--text); overflow-x:hidden; position:relative;}
  body::before{content:""; position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.045; mix-blend-mode:overlay; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
  h1,h2,h3{font-family:'Amiri',serif; font-weight:700;}

  nav{position:fixed; top:0; right:0; left:0; z-index:100; display:flex; justify-content:space-between; align-items:center; padding:16px 6vw; background:rgba(5,5,5,.92); border-bottom:1px solid rgba(201,168,118,.15);}
  nav .brand{display:flex; align-items:center; gap:10px;}
  nav .brand img{height:34px; width:auto; display:block;}
  nav a.back{color:var(--gold-bright); text-decoration:none; font-size:.85rem;}
  nav a.back:hover{color:var(--gold);}

  main{max-width:760px; margin:0 auto; padding:120px 6vw 100px; position:relative; z-index:2;}

  .post-top{display:flex; align-items:center; gap:10px; margin-bottom:18px; font-size:.85rem; color:var(--mist2); flex-wrap:wrap;}
  .avatar{width:34px; height:34px; border-radius:50%; object-fit:cover; border:1px solid rgba(201,168,118,.4); display:block; background:var(--panel);}
  .avatar-fallback{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--panel); border:1px solid rgba(201,168,118,.4); color:var(--gold-bright); font-family:'Amiri',serif; font-size:1rem;}
  .avatar-sm{width:26px; height:26px; font-size:.85rem;}
  .post-top .uname{color:var(--gold-bright);}
  a.uname{color:var(--gold-bright); text-decoration:none;}
  a.uname:hover{color:var(--gold);}
  .post-top .dot{opacity:.5;}
  .post-cat{font-size:.7rem; color:var(--gold); letter-spacing:1.5px; border:1px solid rgba(201,168,118,.3); border-radius:14px; padding:3px 12px; margin-inline-start:auto;}

  #post-title{font-size:clamp(1.6rem, 4vw, 2.2rem); line-height:1.5; margin-bottom:22px;}
  #post-body{color:var(--text); line-height:2; font-size:1.02rem; white-space:pre-wrap; margin-bottom:28px;}

  .post-actions{display:flex; align-items:center; gap:14px; padding:18px 0; border-top:1px solid rgba(201,168,118,.15); border-bottom:1px solid rgba(201,168,118,.15); margin-bottom:36px;}
  .icon-btn{display:inline-flex; align-items:center; gap:7px; background:none; border:none; color:var(--mist2); font-family:'Cairo'; font-size:.88rem; cursor:pointer; padding:6px 10px; border-radius:20px; transition:color .25s, background .25s;}
  .icon-btn svg{width:16px; height:16px;}
  .icon-btn:hover{color:var(--gold-bright); background:rgba(201,168,118,.08);}
  .icon-btn.liked{color:var(--gold);}
  .icon-btn.danger:hover{color:#d98a8a;}
  .spacer{margin-inline-start:auto;}

  .reaction-bar{display:inline-flex; align-items:center; gap:4px; background:rgba(201,168,118,.05); border:1px solid rgba(201,168,118,.15); border-radius:20px; padding:4px 6px;}
  .reaction-bar.compact{padding:3px 5px; gap:2px;}
  .reaction-btn{background:none; border:none; font-size:1rem; line-height:1; cursor:pointer; padding:5px 7px; border-radius:14px; opacity:.55; transition:opacity .2s, background .2s, transform .15s;}
  .reaction-bar.compact .reaction-btn{font-size:.85rem; padding:4px 5px;}
  .reaction-btn:hover{opacity:1; transform:scale(1.12);}
  .reaction-btn.active{opacity:1; background:rgba(201,168,118,.18);}
  .reaction-total{color:var(--mist2); font-size:.82rem; padding:0 8px 0 4px;}

  h2.section-title{font-size:1.15rem; margin-bottom:20px; color:var(--gold-bright);}

  .comment-form{margin-bottom:34px;}
  .comment-form textarea{width:100%; min-height:90px; padding:14px 16px; font-family:'Cairo'; font-size:.94rem; background:var(--panel); border:1px solid rgba(201,168,118,.3); border-radius:2px; color:var(--text); resize:vertical; line-height:1.7; margin-bottom:10px;}
  .comment-form textarea:focus{outline:none; border-color:var(--gold);}
  .login-prompt{background:var(--panel); border:1px solid rgba(201,168,118,.2); border-radius:2px; padding:20px 24px; margin-bottom:34px; color:var(--mist2); font-size:.92rem; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}

  .btn{display:inline-flex; align-items:center; gap:10px; padding:12px 26px; border-radius:2px; text-decoration:none; font-size:.88rem; border:none; cursor:pointer; font-family:'Cairo'; transition:opacity .3s;}
  .btn:hover{opacity:.88;}
  .btn-primary{background:var(--gold); color:#111; font-weight:700;}
  .btn-ghost{background:transparent; color:var(--gold-bright); border:1px solid rgba(201,168,118,.35);}
  .btn-ghost:hover{border-color:var(--gold);}

  .comment{padding:20px 0; border-bottom:1px solid rgba(201,168,118,.1);}
  .comment .c-body{color:var(--text); line-height:1.85; font-size:.95rem; margin:10px 0 12px; white-space:pre-wrap;}
  .comment .c-actions{display:flex; align-items:center; gap:8px;}
  .replies{margin-inline-start:32px; margin-top:6px; border-inline-start:1px solid rgba(201,168,118,.15); padding-inline-start:20px;}
  .replies .comment{padding:16px 0;}
  .reply-form{margin-top:12px; display:none;}
  .reply-form.open{display:block;}
  .reply-form textarea{width:100%; min-height:70px; padding:12px 14px; font-family:'Cairo'; font-size:.9rem; background:var(--panel); border:1px solid rgba(201,168,118,.3); border-radius:2px; color:var(--text); resize:vertical; line-height:1.6; margin-bottom:8px;}
  .reply-form textarea:focus{outline:none; border-color:var(--gold);}

  .empty-state{text-align:center; padding:30px 20px; color:var(--mist2); font-size:.9rem;}
  .form-error{color:#d98a8a; font-size:.85rem; margin:8px 0; display:none;}
  .form-error.show{display:block;}

  footer{text-align:center; padding:36px 6vw; color:var(--mist2); font-size:.78rem; border-top:1px solid rgba(201,168,118,.15); position:relative; z-index:2;}
  footer img{height:20px; vertical-align:middle; margin-left:8px; opacity:.8;}

  @media (max-width:760px){
    nav{padding:16px 5vw;}
    main{padding:110px 6vw 80px;}
    .replies{margin-inline-start:16px; padding-inline-start:12px;}
  }

  /* real photographic backgrounds — hero band + mid-page image breaks */
  .hero-band{position:relative; min-height:48vh; display:flex; align-items:center; justify-content:center; text-align:center; background-size:cover; background-position:center; overflow:hidden; background-image:url('/images/hero.jpg');}
  .hero-band::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(5,5,5,.55) 0%, rgba(5,5,5,.7) 55%, rgba(5,5,5,.95) 100%);}
  .hero-band-inner{position:relative; z-index:2; padding:150px 8vw 50px; max-width:900px;}
  .mid-band{position:relative; min-height:34vh; background-size:cover; background-position:center; overflow:hidden;}
  .mid-band::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(5,5,5,.45), rgba(5,5,5,.65));}
  .mid-band.temple{background-image:url('/images/section-temple.jpg');}
  .mid-band.corridor{background-image:url('/images/section-corridor.jpg');}
</style>
</head>
<body>

<nav>
  <div class="brand"><img src="/images/logo.jpg" alt="في البرزخ"></div>
  <a href="/majlis.html" class="back">→ مجلس البرزخ</a>
</nav>

<main id="main-content">
  <p class="empty-state" id="loading-state">بنجيب المنشور...</p>
</main>

<footer>
  <img src="/images/logo.jpg" alt="">
  © <span id="year"></span> في البرزخ — جميع الأفكار محفوظة لصاحبها
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const API = '/api/community';
const postId = new URLSearchParams(window.location.search).get('id');

let currentUser = null;
let postData = null;
let commentsData = [];

const HEART_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20.5s-7.5-4.6-9.7-9C.8 8 2 4.7 5.2 4c2.1-.5 3.9.4 4.9 1.9C11.1 4.4 12.9 3.5 15 4c3.2.7 4.4 4 3 7.5-2.2 4.4-6 9-6 9z"/></svg>';
const FLAG_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 21V4h13l-3 4 3 4H5"/></svg>';
const TRASH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>';
const REPLY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 17l-5-5 5-5M4 12h11a5 5 0 0 1 5 5v2"/></svg>';

function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function timeAgo(iso){
  const diffMs = Date.now() - new Date(iso + (iso.endsWith('Z') ? '' : 'Z')).getTime();
  const mins = Math.floor(diffMs / 60000);
  if(mins < 1) return 'الآن';
  if(mins < 60) return `منذ ${mins} د`;
  const hours = Math.floor(mins / 60);
  if(hours < 24) return `منذ ${hours} س`;
  const days = Math.floor(hours / 24);
  if(days < 30) return `منذ ${days} يوم`;
  const months = Math.floor(days / 30);
  if(months < 12) return `منذ ${months} شهر`;
  return `منذ ${Math.floor(months / 12)} سنة`;
}

function avatarHTML(username, avatarUrl, sizeClass){
  return avatarUrl
    ? `<img class="avatar ${sizeClass||''}" src="${escapeHTML(avatarUrl)}" alt="">`
    : `<span class="avatar-fallback ${sizeClass||''}">${escapeHTML((username||'?').charAt(0))}</span>`;
}

async function fetchSession(){
  try{
    const res = await fetch(`${API}/session`, { credentials: 'include' });
    const data = await res.json();
    currentUser = data.user || null;
  } catch(e){ currentUser = null; }
}

/* ---------- render ---------- */

function renderPage(){
  const main = document.getElementById('main-content');
  if(!postData){
    main.innerHTML = `<p class="empty-state">المنشور ده مش موجود، أو اتحذف.<br><a href="/majlis.html" class="btn btn-ghost" style="margin-top:16px;">رجوع لمجلس البرزخ</a></p>`;
    return;
  }
  const p = postData;
  const canDeletePost = currentUser && (currentUser.id === p.user_id || currentUser.is_admin);

  main.innerHTML = `
    <div class="post-top">
      ${avatarHTML(p.username, p.avatar_url)}
      <a class="uname" href="/majlis-profile.html?u=${encodeURIComponent(p.username)}">${escapeHTML(p.username)}</a>
      <span class="dot">·</span>
      <span>${timeAgo(p.created_at)}</span>
      <span class="post-cat">${escapeHTML(p.category)}</span>
    </div>
    <h1 id="post-title">${escapeHTML(p.title)}</h1>
    ${p.image_url ? `<img src="${escapeHTML(p.image_url)}" alt="" style="width:100%; max-height:480px; object-fit:cover; border-radius:2px; margin-bottom:24px; display:block;" loading="lazy">` : ''}
    <div id="post-body">${escapeHTML(p.body)}</div>
    <div class="post-actions">
      <div class="reaction-bar" data-target-type="post" data-target-id="${p.id}">
        <button class="reaction-btn${p.my_reaction === 'مفيد' ? ' active' : ''}" data-type="مفيد" title="مفيد">💡</button>
        <button class="reaction-btn${p.my_reaction === 'مثير_للتفكير' ? ' active' : ''}" data-type="مثير_للتفكير" title="مثير للتفكير">🤔</button>
        <button class="reaction-btn${p.my_reaction === 'اتفق' ? ' active' : ''}" data-type="اتفق" title="أتفق">❤️</button>
        <button class="reaction-btn${p.my_reaction === 'مختلف_عليه' ? ' active' : ''}" data-type="مختلف_عليه" title="مختلف عليه">🧐</button>
        <span class="reaction-total">${p.like_count}</span>
      </div>
      <button class="icon-btn" id="report-post-btn">${FLAG_ICON} إبلاغ</button>
      ${canDeletePost ? `<button class="icon-btn danger spacer" id="delete-post-btn">${TRASH_ICON} حذف</button>` : ''}
    </div>

    <h2 class="section-title">التعليقات (${commentsData.filter(c => !c.parent_comment_id).length + commentsData.filter(c => c.parent_comment_id).length})</h2>
    <div id="comment-form-area"></div>
    <div id="comments-container"></div>
  `;

  document.querySelectorAll('.reaction-bar[data-target-type="post"] .reaction-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const bar = btn.closest('.reaction-bar');
      toggleReaction(bar.dataset.targetType, parseInt(bar.dataset.targetId, 10), btn.dataset.type, bar);
    });
  });
  document.getElementById('report-post-btn').addEventListener('click', () => reportContent('post', p.id));
  if(canDeletePost){
    document.getElementById('delete-post-btn').addEventListener('click', deletePost);
  }

  renderCommentFormArea();
  renderComments();
}

function renderCommentFormArea(){
  const el = document.getElementById('comment-form-area');
  if(currentUser){
    el.innerHTML = `
      <div class="comment-form">
        <p class="form-error" id="comment-error"></p>
        <textarea id="comment-body" placeholder="اكتب تعليقك..." maxlength="3000"></textarea>
        <button class="btn btn-primary" id="submit-comment-btn">أضف تعليق</button>
      </div>`;
    document.getElementById('submit-comment-btn').addEventListener('click', () => submitComment(null));
  } else {
    el.innerHTML = `
      <div class="login-prompt">
        <span>لازم تسجل دخول عشان تشارك بتعليق.</span>
        <a href="/majlis.html" class="btn btn-ghost">تسجيل الدخول</a>
      </div>`;
  }
}

function commentHTML(c, isReply){
  const canDelete = currentUser && (currentUser.id === c.user_id || currentUser.is_admin);
  return `<div class="comment" data-id="${c.id}">
    <div class="post-top" style="margin-bottom:0;">
      ${avatarHTML(c.username, c.avatar_url, 'avatar-sm')}
      <a class="uname" href="/majlis-profile.html?u=${encodeURIComponent(c.username)}">${escapeHTML(c.username)}</a>
      <span class="dot">·</span>
      <span>${timeAgo(c.created_at)}</span>
    </div>
    <div class="c-body">${escapeHTML(c.body)}</div>
    <div class="c-actions">
      <div class="reaction-bar compact" data-target-type="comment" data-target-id="${c.id}">
        <button class="reaction-btn${c.my_reaction === 'مفيد' ? ' active' : ''}" data-type="مفيد" title="مفيد">💡</button>
        <button class="reaction-btn${c.my_reaction === 'مثير_للتفكير' ? ' active' : ''}" data-type="مثير_للتفكير" title="مثير للتفكير">🤔</button>
        <button class="reaction-btn${c.my_reaction === 'اتفق' ? ' active' : ''}" data-type="اتفق" title="أتفق">❤️</button>
        <button class="reaction-btn${c.my_reaction === 'مختلف_عليه' ? ' active' : ''}" data-type="مختلف_عليه" title="مختلف عليه">🧐</button>
        <span class="reaction-total">${c.like_count}</span>
      </div>
      ${!isReply ? `<button class="icon-btn reply-btn" data-id="${c.id}">${REPLY_ICON} رد</button>` : ''}
      <button class="icon-btn report-comment-btn" data-id="${c.id}">${FLAG_ICON}</button>
      ${canDelete ? `<button class="icon-btn danger delete-comment-btn" data-id="${c.id}">${TRASH_ICON}</button>` : ''}
    </div>
    ${!isReply ? `<div class="reply-form" id="reply-form-${c.id}">
      <textarea placeholder="اكتب ردك..." maxlength="3000"></textarea>
      <button class="btn btn-primary" style="padding:9px 20px; font-size:.82rem;" data-parent="${c.id}">إرسال الرد</button>
    </div>` : ''}
  </div>`;
}

function renderComments(){
  const container = document.getElementById('comments-container');
  const topLevel = commentsData.filter(c => !c.parent_comment_id);

  if(topLevel.length === 0){
    container.innerHTML = `<p class="empty-state">لسه مفيش تعليقات — كن أول من يعلّق.</p>`;
    return;
  }

  container.innerHTML = topLevel.map(c => {
    const replies = commentsData.filter(r => r.parent_comment_id === c.id);
    const repliesHTML = replies.length
      ? `<div class="replies">${replies.map(r => commentHTML(r, true)).join('')}</div>`
      : '';
    return commentHTML(c, false) + repliesHTML;
  }).join('');

  container.querySelectorAll('.reaction-bar[data-target-type="comment"] .reaction-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const bar = btn.closest('.reaction-bar');
      toggleReaction(bar.dataset.targetType, parseInt(bar.dataset.targetId, 10), btn.dataset.type, bar);
    });
  });
  container.querySelectorAll('.report-comment-btn').forEach(btn => {
    btn.addEventListener('click', () => reportContent('comment', parseInt(btn.dataset.id, 10)));
  });
  container.querySelectorAll('.delete-comment-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteComment(parseInt(btn.dataset.id, 10)));
  });
  container.querySelectorAll('.reply-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if(!currentUser){ window.location.href = '/majlis.html'; return; }
      const form = document.getElementById(`reply-form-${btn.dataset.id}`);
      form.classList.toggle('open');
    });
  });
  container.querySelectorAll('.reply-form button[data-parent]').forEach(btn => {
    btn.addEventListener('click', () => {
      const parentId = parseInt(btn.dataset.parent, 10);
      const textarea = btn.closest('.reply-form').querySelector('textarea');
      submitComment(parentId, textarea);
    });
  });
}

/* ---------- actions ---------- */

async function toggleReaction(targetType, targetId, reactionType, barEl){
  if(!currentUser){ window.location.href = '/majlis.html'; return; }
  try{
    const res = await fetch(`${API}/likes`, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target_type: targetType, target_id: targetId, reaction_type: reactionType })
    });
    const data = await res.json();
    if(!res.ok) return;
    barEl.querySelectorAll('.reaction-btn').forEach(b => b.classList.toggle('active', b.dataset.type === data.reaction));
    const totalEl = barEl.querySelector('.reaction-total');
    if(totalEl) totalEl.textContent = data.total;
  } catch(e){}
}

async function reportContent(targetType, targetId){
  if(!currentUser){ window.location.href = '/majlis.html'; return; }
  if(!confirm('تأكيد الإبلاغ عن المحتوى ده؟')) return;
  try{
    await fetch(`${API}/reports`, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target_type: targetType, target_id: targetId })
    });
    alert('تم الإبلاغ، شكرًا لك.');
  } catch(e){
    alert('حصل خطأ، حاول تاني.');
  }
}

async function deletePost(){
  if(!confirm('متأكد إنك عايز تحذف المنشور ده؟ الإجراء ده مش قابل للتراجع.')) return;
  try{
    const res = await fetch(`${API}/posts/${postId}`, { method: 'DELETE', credentials: 'include' });
    if(res.ok){ window.location.href = '/majlis.html'; }
  } catch(e){}
}

async function deleteComment(commentId){
  if(!confirm('متأكد إنك عايز تحذف التعليق ده؟')) return;
  try{
    const res = await fetch(`${API}/comments`, {
      method: 'DELETE', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ comment_id: commentId })
    });
    if(res.ok){
      commentsData = commentsData.filter(c => c.id !== commentId && c.parent_comment_id !== commentId);
      renderComments();
    }
  } catch(e){}
}

async function submitComment(parentId, textareaEl){
  const textarea = textareaEl || document.getElementById('comment-body');
  const errEl = parentId ? null : document.getElementById('comment-error');
  const body = textarea.value.trim();
  if(errEl) errEl.classList.remove('show');
  if(body.length < 1){ return; }
  try{
    const res = await fetch(`${API}/comments`, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ post_id: parseInt(postId, 10), body, parent_comment_id: parentId })
    });
    const data = await res.json();
    if(!res.ok){
      if(errEl){ errEl.textContent = data.error || 'حصل خطأ، حاول تاني.'; errEl.classList.add('show'); }
      return;
    }
    textarea.value = '';
    await loadComments();
    renderComments();
  } catch(e){
    if(errEl){ errEl.textContent = 'حصل خطأ في الاتصال، حاول تاني.'; errEl.classList.add('show'); }
  }
}

/* ---------- load ---------- */

async function loadPost(){
  const res = await fetch(`${API}/posts/${postId}`);
  if(!res.ok){ postData = null; return; }
  const data = await res.json();
  postData = data.post;
}

async function loadComments(){
  const res = await fetch(`${API}/comments?post_id=${postId}`);
  if(!res.ok){ commentsData = []; return; }
  const data = await res.json();
  commentsData = data.comments || [];
}

async function init(){
  if(!postId){
