<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساحتي | مجلس البرزخ</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#050505; --panel:#0e0e0e; --gold:#c9a876; --gold-bright:#e0c496; --gold-dim:#8a734f;
    --wine:#6e2635; --mist:#a3a0987d; --mist2:#b8b3a8; --text:#ece7dc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:'Cairo',sans-serif; background:radial-gradient(ellipse 1100px 640px at 50% -10%, var(--panel) 0%, var(--black) 68%) var(--black); color:var(--text); overflow-x:hidden; position:relative;}
  body::before{content:""; position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.045; mix-blend-mode:overlay; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
  h1,h2,h3{font-family:'Amiri',serif; font-weight:700;}

  nav{position:fixed; top:0; right:0; left:0; z-index:100; display:flex; justify-content:space-between; align-items:center; padding:16px 6vw; background:rgba(5,5,5,.92); border-bottom:1px solid rgba(201,168,118,.15);}
  nav .brand{display:flex; align-items:center; gap:10px;}
  nav .brand img{height:34px; width:auto; display:block;}
  nav a.back{color:var(--gold-bright); text-decoration:none; font-size:.85rem;}
  nav a.back:hover{color:var(--gold);}

  main{max-width:760px; margin:0 auto; padding:130px 6vw 100px; position:relative; z-index:2;}

  .profile-head{display:flex; align-items:center; gap:22px; margin-bottom:20px; flex-wrap:wrap;}
  .avatar-lg{width:84px; height:84px; border-radius:50%; object-fit:cover; border:1px solid rgba(201,168,118,.4); display:block; background:var(--panel);}
  .avatar-lg-fallback{width:84px; height:84px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--panel); border:1px solid rgba(201,168,118,.4); color:var(--gold-bright); font-family:'Amiri',serif; font-size:2rem;}
  .profile-head h1{font-size:1.7rem;}
  .profile-head .joined{color:var(--mist2); font-size:.85rem; margin-top:6px;}
  .profile-bio{color:var(--text); line-height:1.9; margin:8px 0 6px; max-width:560px;}
  .profile-bio.empty{color:var(--mist2); font-style:italic;}

  .stats-row{display:flex; gap:1px; background:rgba(201,168,118,.18); border:1px solid rgba(201,168,118,.18); margin:26px 0 10px;}
  .stat-box{flex:1; background:var(--black); text-align:center; padding:18px 10px;}
  .stat-box .num{font-family:'Amiri',serif; font-size:1.6rem; color:var(--gold-bright); display:block;}
  .stat-box .label{font-size:.76rem; color:var(--mist2); margin-top:4px;}

  .badges-row{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px;}
  .badge-chip{display:flex; align-items:center; gap:7px; background:rgba(201,168,118,.06); border:1px solid rgba(201,168,118,.25); border-radius:20px; padding:8px 14px; font-size:.8rem; color:var(--gold-bright);}
  .badge-chip .icon{font-size:1.05rem;}

  .tabs{display:flex; gap:8px; margin:36px 0 20px; border-bottom:1px solid rgba(201,168,118,.15); flex-wrap:wrap;}
  .tab-btn{background:transparent; border:none; color:var(--mist2); font-family:'Cairo'; font-size:.88rem; padding:10px 6px; cursor:pointer; border-bottom:2px solid transparent; transition:color .25s, border-color .25s;}
  .tab-btn.active{color:var(--gold-bright); border-color:var(--gold);}
  .tab-btn:hover{color:var(--gold-bright);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .post-list{display:flex; flex-direction:column; gap:1px; background:rgba(201,168,118,.18); border:1px solid rgba(201,168,118,.18);}
  .post-card{background:var(--black); padding:20px 24px; text-decoration:none; color:inherit; display:block; transition:background .3s;}
  .post-card:hover{background:var(--panel);}
  .post-card .post-cat{font-size:.7rem; color:var(--gold); letter-spacing:1.5px; margin-bottom:8px; display:block;}
  .post-card h3{font-size:1.05rem; margin-bottom:8px; line-height:1.5;}
  .post-meta{display:flex; align-items:center; gap:18px; font-size:.82rem; color:var(--mist2);}
  .post-card .save-note{margin-top:10px; padding-top:10px; border-top:1px dashed rgba(201,168,118,.2); color:var(--mist2); font-size:.85rem; line-height:1.7; font-style:italic;}

  .empty-state{text-align:center; padding:40px 20px; color:var(--mist2);}

  .btn{display:inline-flex; align-items:center; gap:8px; padding:11px 22px; border-radius:2px; text-decoration:none; font-size:.85rem; border:none; cursor:pointer; font-family:'Cairo'; transition:opacity .3s;}
  .btn-ghost{background:transparent; color:var(--gold-bright); border:1px solid rgba(201,168,118,.35);}
  .btn-ghost:hover{border-color:var(--gold);}

  footer{text-align:center; padding:36px 6vw; color:var(--mist2); font-size:.78rem; border-top:1px solid rgba(201,168,118,.15); position:relative; z-index:2;}
  footer img{height:20px; vertical-align:middle; margin-left:8px; opacity:.8;}

  @media (max-width:760px){
    nav{padding:16px 5vw;}
    main{padding:120px 6vw 80px;}
    .stats-row{flex-wrap:wrap;}
    .stat-box{flex:1 1 45%;}
  }
</style>
</head>
<body>

<nav>
  <div class="brand"><img src="/images/logo.jpg" alt="في البرزخ"></div>
  <a href="/majlis.html" class="back">→ مجلس البرزخ</a>
</nav>

<main id="main-content">
  <p class="empty-state" id="loading-msg">جاري التحميل...</p>
</main>

<footer>
  <img src="/images/logo.jpg" alt="">
  © <span id="year"></span> في البرزخ — جميع الأفكار محفوظة لصاحبها
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
const API = '/api/community';

const BADGE_LABELS = {
  first_step: { label: 'أول خطوة', icon: '🌱' },
  discussant: { label: 'المحاور', icon: '🗣️' },
  reader: { label: 'القارئ', icon: '📖' },
  explorer: { label: 'المستكشف', icon: '🧭' },
  council: { label: 'عضو مجلس البرزخ', icon: '🏛️' },
};

function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function timeAgo(iso){
  const diffMs = Date.now() - new Date(iso + 'Z').getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return 'الآن';
  if (mins < 60) return `منذ ${mins} دقيقة`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `منذ ${hours} ساعة`;
  const days = Math.floor(hours / 24);
  if (days < 30) return `منذ ${days} يوم`;
  return new Date(iso + 'Z').toLocaleDateString('ar-EG');
}

function postCardHTML(p){
  return `<a class="post-card" href="/majlis-post.html?id=${p.id}">
    <span class="post-cat">${escapeHTML(p.category || '')}</span>
    <h3>${escapeHTML(p.title)}</h3>
    <div class="post-meta"><span>${timeAgo(p.created_at)}</span>${p.comment_count != null ? `<span>💬 ${p.comment_count}</span>` : ''}${p.like_count != null ? `<span>♡ ${p.like_count}</span>` : ''}</div>
    ${p.note ? `<div class="save-note">${escapeHTML(p.note)}</div>` : ''}
  </a>`;
}

async function init(){
  let session;
  try {
    const res = await fetch(`${API}/session`, { credentials: 'include' });
    session = await res.json();
  } catch { session = { user: null }; }

  if (!session.user) {
    document.getElementById('main-content').innerHTML =
      `<p class="empty-state">لازم تسجل دخول الأول عشان تشوف مساحتك.<br><br><a class="btn btn-ghost" href="/majlis.html">روح لمجلس البرزخ ↗</a></p>`;
    return;
  }

  const [profileRes, savesRes, followsRes] = await Promise.all([
    fetch(`${API}/users/${encodeURIComponent(session.user.username)}`).then(r => r.json()),
    fetch(`${API}/saves`, { credentials: 'include' }).then(r => r.json()),
    fetch(`${API}/follows`, { credentials: 'include' }).then(r => r.json()),
  ]);

  const user = profileRes.user;
  const stats = profileRes.stats || {};
  const posts = profileRes.posts || [];
  const badges = profileRes.badges || [];
  const saves = savesRes.saves || [];
  const follows = followsRes.follows || [];

  const avatarHTML = user.avatar_url
    ? `<img class="avatar-lg" src="${escapeHTML(user.avatar_url)}" alt="">`
    : `<div class="avatar-lg-fallback">${escapeHTML((user.username || '؟')[0])}</div>`;

  const joinedDate = new Date(user.created_at + 'Z').toLocaleDateString('ar-EG', { year: 'numeric', month: 'long' });

  document.getElementById('main-content').innerHTML = `
    <div class="profile-head">
      ${avatarHTML}
      <div>
        <h1>${escapeHTML(user.username)}</h1>
        <div class="joined">عضو منذ ${joinedDate}</div>
      </div>
    </div>
    <p class="profile-bio${user.bio ? '' : ' empty'}">${user.bio ? escapeHTML(user.bio) : 'مفيش نبذة لسه.'}</p>
    <a class="btn btn-ghost" href="/majlis-profile.html?u=${encodeURIComponent(user.username)}">عدّل البروفايل ↗</a>

    <div class="stats-row">
      <div class="stat-box"><span class="num">${user.reputation ?? 0}</span><span class="label">نقاط السمعة</span></div>
      <div class="stat-box"><span class="num">${stats.posts_count ?? 0}</span><span class="label">نقاشات</span></div>
      <div class="stat-box"><span class="num">${stats.comments_count ?? 0}</span><span class="label">تعليقات</span></div>
      <div class="stat-box"><span class="num">${stats.reactions_received ?? 0}</span><span class="label">تفاعلات استلمتها</span></div>
    </div>

    ${badges.length ? `<div class="badges-row">${badges.map(b => {
      const info = BADGE_LABELS[b.badge_key] || { label: b.badge_key, icon: '🎖️' };
      return `<span class="badge-chip"><span class="icon">${info.icon}</span>${escapeHTML(info.label)}</span>`;
    }).join('')}</div>` : ''}

    <div class="tabs">
      <button class="tab-btn active" data-tab="posts">نقاشاتي (${posts.length})</button>
      <button class="tab-btn" data-tab="saves">محفوظاتي (${saves.length})</button>
      <button class="tab-btn" data-tab="follows">بتابعها (${follows.length})</button>
    </div>

    <div class="tab-panel active" id="tab-posts">
      ${posts.length ? `<div class="post-list">${posts.map(postCardHTML).join('')}</div>` : '<p class="empty-state">لسه معملتش أي نقاش.</p>'}
    </div>
    <div class="tab-panel" id="tab-saves">
      ${saves.length ? `<div class="post-list">${saves.filter(s => s.target_type === 'post').map(s => postCardHTML({ id: s.target_id, title: s.post_title, category: s.post_category, created_at: s.created_at, note: s.note })).join('')}</div>` : '<p class="empty-state">لسه معملتش حفظ لحاجة.</p>'}
    </div>
    <div class="tab-panel" id="tab-follows">
      ${follows.length ? `<div class="post-list">${follows.map(f => postCardHTML({ id: f.post_id, title: f.title, category: f.category, created_at: f.created_at })).join('')}</div>` : '<p class="empty-state">مش بتابع أي نقاش دلوقتي.</p>'}
    </div>
  `;

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });
}

init();
</script>

</body>
</html>
