<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر البرزخ | مجلس البرزخ</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#050505; --panel:#0e0e0e; --gold:#c9a876; --gold-bright:#e0c496; --gold-dim:#8a734f;
    --wine:#6e2635; --mist:#a3a0987d; --mist2:#b8b3a8; --text:#ece7dc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:'Cairo',sans-serif; background:radial-gradient(ellipse 1100px 640px at 50% -10%, var(--panel) 0%, var(--black) 68%) var(--black); color:var(--text); overflow-x:hidden; position:relative;}
  body::before{content:""; position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.045; mix-blend-mode:overlay; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
  h1,h2,h3{font-family:'Amiri',serif; font-weight:700;}

  nav{position:fixed; top:0; right:0; left:0; z-index:100; display:flex; justify-content:space-between; align-items:center; padding:16px 6vw; background:rgba(5,5,5,.92); border-bottom:1px solid rgba(201,168,118,.15);}
  nav .brand{display:flex; align-items:center; gap:10px;}
  nav .brand img{height:34px; width:auto; display:block;}
  nav a.back{color:var(--gold-bright); text-decoration:none; font-size:.85rem;}
  nav a.back:hover{color:var(--gold);}

  main{max-width:720px; margin:0 auto; padding:130px 6vw 100px; position:relative; z-index:2;}
  .page-head{margin-bottom:8px;}
  .threshold{display:flex; align-items:center; gap:16px; width:100%; margin-bottom:16px;}
  .threshold::before, .threshold::after{content:""; height:1px; flex:1; background:var(--gold-dim); opacity:.4;}
  .threshold span{font-size:.7rem; letter-spacing:3px; color:var(--gold-dim);}
  .page-head h1{font-size:1.9rem; margin-bottom:10px;}
  .page-head p{color:var(--mist2); line-height:1.9; max-width:560px;}

  .add-form{margin:32px 0 40px; border:1px solid rgba(201,168,118,.18); border-radius:4px; padding:22px 24px; background:rgba(201,168,118,.03);}
  .add-form.collapsed .fields{display:none;}
  .add-toggle{background:transparent; border:1px dashed rgba(201,168,118,.35); color:var(--gold-bright); font-family:'Cairo'; font-size:.9rem; padding:12px 20px; width:100%; border-radius:4px; cursor:pointer; text-align:center; transition:border-color .25s;}
  .add-toggle:hover{border-color:var(--gold);}
  .type-pills{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 16px;}
  .type-pill{padding:7px 16px; border:1px solid rgba(201,168,118,.3); border-radius:18px; font-size:.8rem; color:var(--mist2); background:transparent; cursor:pointer; font-family:'Cairo'; transition:all .2s;}
  .type-pill.active{background:var(--gold); color:#111; border-color:var(--gold); font-weight:700;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:.8rem; color:var(--mist2); margin-bottom:6px;}
  .field input, .field textarea{width:100%; padding:11px 14px; font-family:'Cairo'; font-size:.9rem; background:var(--black); border:1px solid rgba(201,168,118,.25); border-radius:2px; color:var(--text);}
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--gold);}
  .field textarea{min-height:70px; resize:vertical;}
  .btn{display:inline-flex; align-items:center; gap:8px; padding:11px 24px; border-radius:2px; border:none; cursor:pointer; font-family:'Cairo'; font-size:.86rem; transition:opacity .3s;}
  .btn-primary{background:var(--gold); color:#111; font-weight:700;}
  .btn-primary:hover{opacity:.9;}
  .form-error{color:#e07a7a; font-size:.85rem; margin-bottom:10px; display:none;}

  .filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px;}
  .pill{padding:7px 16px; border:1px solid rgba(201,168,118,.25); border-radius:18px; font-size:.8rem; color:var(--mist2); cursor:pointer; background:transparent; transition:all .2s; font-family:'Cairo';}
  .pill.active{background:var(--gold); color:#111; border-color:var(--gold); font-weight:700;}

  .entry-list{display:flex; flex-direction:column; gap:14px;}
  .entry{border:1px solid rgba(201,168,118,.18); border-radius:4px; padding:18px 22px; background:var(--panel); position:relative;}
  .entry .kind-tag{font-size:.7rem; color:var(--gold); letter-spacing:1px; margin-bottom:8px; display:inline-flex; align-items:center; gap:6px;}
  .entry h3{font-size:1.05rem; margin-bottom:8px; line-height:1.5;}
  .entry a.entry-link{color:var(--gold-bright); text-decoration:none; font-size:.85rem;}
  .entry .entry-note{color:var(--mist2); font-size:.88rem; line-height:1.8; margin-top:8px; border-right:2px solid rgba(110,38,53,.5); padding-right:12px;}
  .entry .entry-date{color:var(--mist2); font-size:.75rem; margin-top:10px;}
  .entry .remove-btn{position:absolute; top:14px; left:14px; background:transparent; border:none; color:var(--mist2); cursor:pointer; font-size:.9rem; opacity:.6;}
  .entry .remove-btn:hover{opacity:1; color:#e07a7a;}

  .empty-state{text-align:center; padding:40px 20px; color:var(--mist2);}

  footer{text-align:center; padding:36px 6vw; color:var(--mist2); font-size:.78rem; border-top:1px solid rgba(201,168,118,.15); position:relative; z-index:2;}
  footer img{height:20px; vertical-align:middle; margin-left:8px; opacity:.8;}

  @media (max-width:760px){
    nav{padding:16px 5vw;}
    main{padding:120px 6vw 80px;}
  }
</style>
</head>
<body>

<nav>
  <div class="brand"><img src="/images/logo.jpg" alt="في البرزخ"></div>
  <a href="/majlis.html" class="back">→ مجلس البرزخ</a>
</nav>

<main id="main-content">
  <p class="empty-state" id="loading-msg">جاري التحميل...</p>
</main>

<footer>
  <img src="/images/logo.jpg" alt="">
  © <span id="year"></span> في البرزخ — جميع الأفكار محفوظة لصاحبها
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
const API = '/api/community';

const KIND_META = {
  post: { label: 'نقاش', icon: '💬' },
  comment: { label: 'تعليق', icon: '💬' },
  episode: { label: 'حلقة', icon: '🎬' },
  article: { label: 'مقال', icon: '📝' },
  link: { label: 'رابط', icon: '🔗' },
  quote: { label: 'اقتباس', icon: '✒️' },
};

let currentFilter = 'الكل';
let allSaves = [];

function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function entryTitle(s){
  if (s.target_type === 'post') return s.post_title || 'نقاش محذوف';
  if (s.target_type === 'comment') return (s.comment_body || '').slice(0, 80) || 'تعليق محذوف';
  return s.title || '(بلا عنوان)';
}

function entryLink(s){
  if (s.target_type === 'post') return `/majlis-post.html?id=${s.target_id}`;
  if (s.target_type === 'comment') return `/majlis-post.html?id=${s.target_id}`;
  return s.url || null;
}

function entryHTML(s){
  const meta = KIND_META[s.target_type] || { label: s.target_type, icon: '📌' };
  const link = entryLink(s);
  const title = escapeHTML(entryTitle(s));
  return `<div class="entry" data-id="${s.id}">
    <button class="remove-btn" data-id="${s.id}" title="حذف">✕</button>
    <span class="kind-tag">${meta.icon} ${meta.label}</span>
    <h3>${link ? `<a class="entry-link" href="${link}" target="${s.target_type==='link' ? '_blank' : '_self'}" rel="noopener">${title}</a>` : title}</h3>
    ${s.note ? `<div class="entry-note">${escapeHTML(s.note)}</div>` : ''}
    <div class="entry-date">${new Date(s.created_at + 'Z').toLocaleDateString('ar-EG')}</div>
  </div>`;
}

function renderFilters(){
  const types = ['الكل', ...new Set(allSaves.map(s => s.target_type))];
  const container = document.getElementById('notebook-filters');
  container.innerHTML = types.map(t => {
    const label = t === 'الكل' ? 'الكل' : (KIND_META[t]?.label || t);
    return `<button class="pill${currentFilter === t ? ' active' : ''}" data-type="${t}">${label}</button>`;
  }).join('');
  container.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => { currentFilter = btn.dataset.type; renderFilters(); renderList(); });
  });
}

function renderList(){
  const list = currentFilter === 'الكل' ? allSaves : allSaves.filter(s => s.target_type === currentFilter);
  const el = document.getElementById('notebook-entries');
  el.innerHTML = list.length ? `<div class="entry-list">${list.map(entryHTML).join('')}</div>` : '<p class="empty-state">مفيش حاجة محفوظة هنا لسه.</p>';
  el.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', () => removeEntry(parseInt(btn.dataset.id, 10)));
  });
}

async function removeEntry(id){
  try{
    await fetch(`${API}/saves`, {
      method: 'DELETE', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ save_id: id })
    });
    allSaves = allSaves.filter(s => s.id !== id);
    renderFilters();
    renderList();
  } catch(e){}
}

function setupAddForm(){
  const toggleBtn = document.getElementById('add-toggle-btn');
  const form = document.getElementById('add-form');
  toggleBtn.addEventListener('click', () => form.classList.toggle('collapsed'));

  let selectedType = 'quote';
  const pills = document.querySelectorAll('.type-pill');
  pills.forEach(p => p.addEventListener('click', () => {
    pills.forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    selectedType = p.dataset.type;
    document.getElementById('field-url').style.display = selectedType === 'link' ? 'block' : 'none';
  }));

  document.getElementById('notebook-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('add-error');
    errEl.style.display = 'none';
    const title = document.getElementById('add-title').value.trim();
    const url = document.getElementById('add-url').value.trim();
    const note = document.getElementById('add-note').value.trim();
    try{
      const res = await fetch(`${API}/saves`, {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target_type: selectedType, title, url: url || undefined, note: note || undefined })
      });
      const data = await res.json();
      if(!res.ok){ errEl.textContent = data.error || 'حصل خطأ.'; errEl.style.display = 'block'; return; }
      document.getElementById('notebook-form').reset();
      form.classList.add('collapsed');
      await loadSaves();
    } catch(e){
      errEl.textContent = 'حصل خطأ في الاتصال.'; errEl.style.display = 'block';
    }
  });
}

async function loadSaves(){
  const res = await fetch(`${API}/saves`, { credentials: 'include' });
  const data = await res.json();
  allSaves = data.saves || [];
  renderFilters();
  renderList();
}

async function init(){
  let session;
  try {
    const res = await fetch(`${API}/session`, { credentials: 'include' });
    session = await res.json();
  } catch { session = { user: null }; }

  if (!session.user) {
    document.getElementById('main-content').innerHTML =
      `<p class="empty-state">لازم تسجل دخول الأول عشان تشوف دفترك.<br><br><a class="btn btn-primary" href="/majlis.html">روح لمجلس البرزخ ↗</a></p>`;
    return;
  }

  document.getElementById('main-content').innerHTML = `
    <div class="page-head">
      <div class="threshold"><span>مساحة شخصية</span></div>
      <h1>دفتر البرزخ</h1>
      <p>مكان هادئ تحتفظ فيه بالأفكار، الأسئلة، الاقتباسات، والروابط اللي عايز ترجعلها — مع ملاحظة بسيطة لو حبيت.</p>
    </div>

    <div class="add-form collapsed" id="add-form">
      <button class="add-toggle" id="add-toggle-btn">+ أضف حاجة جديدة للدفتر</button>
      <div class="fields">
        <form id="notebook-form">
          <p class="form-error" id="add-error"></p>
          <div class="type-pills">
            <button type="button" class="type-pill active" data-type="quote">✒️ اقتباس</button>
            <button type="button" class="type-pill" data-type="link">🔗 رابط</button>
            <button type="button" class="type-pill" data-type="episode">🎬 حلقة</button>
            <button type="button" class="type-pill" data-type="article">📝 مقال</button>
          </div>
          <div class="field"><label>العنوان / النص</label><input type="text" id="add-title" required maxlength="200"></div>
          <div class="field" id="field-url" style="display:none;"><label>الرابط (اختياري)</label><input type="url" id="add-url" placeholder="https://..."></div>
          <div class="field"><label>ملاحظتك (اختياري)</label><textarea id="add-note" maxlength="500" placeholder="مثلًا: حفظت الفكرة دي لأني عايز أبحث أكتر في..."></textarea></div>
          <button type="submit" class="btn btn-primary">حفظ في الدفتر</button>
        </form>
      </div>
    </div>

    <div class="filters" id="notebook-filters"></div>
    <div id="notebook-entries"><p class="empty-state">جاري التحميل...</p></div>
  `;

  setupAddForm();
  await loadSaves();
}

init();
</script>

</body>
</html>
